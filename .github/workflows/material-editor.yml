name: Material Editor (Windows)

on:
  push:
    branches: [material-editor]
  workflow_dispatch:

jobs:
  build-editor:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure standalone editor
        shell: pwsh
        run: |
          cmake -S material_editor -B build/material-editor -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build only the editor (no renderer or regression tests)
        shell: pwsh
        run: |
          cmake --build build/material-editor --config Release --target jkgm-material-editor --parallel

      - name: Deploy editor Qt runtime
        shell: pwsh
        run: |
          $exe = "build/material-editor/Release/jkgm-material-editor.exe"
          if (!(Test-Path $exe)) { throw "Editor executable not found: $exe" }
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

      - name: Upload standalone Windows editor
        uses: actions/upload-artifact@v4
        with:
          name: JkGfxMod-Material-Editor-Windows-x64
          path: build/material-editor/Release/
          if-no-files-found: error
