name: Material Editor (Windows, single EXE)

on:
  push:
    branches: [material-editor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-editor:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC developer tools (dumpbin)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure standalone static editor
        shell: pwsh
        run: |
          cmake -S material_editor -B build/material-editor -G "Visual Studio 17 2022" -A x64

      - name: Build only the editor
        shell: pwsh
        run: |
          cmake --build build/material-editor --config Release --target jkgm-material-editor editor-source-pack-tests editor-settings-tests editor-image-tests editor-animation-tests --parallel

      - name: Verify source-pack inheritance and serialization
        shell: pwsh
        run: |
          & "build/material-editor/Release/editor-source-pack-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "Source pack tests failed" }

      - name: Verify portable settings and multi-root MAT resolution
        shell: pwsh
        run: |
          & "build/material-editor/Release/editor-settings-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "Portable editor settings tests failed" }

      - name: Verify compact image codec and sRGB alpha handling
        shell: pwsh
        run: |
          & "build/material-editor/Release/editor-image-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "Image conversion regression tests failed" }

      - name: Verify texture animation timing and pulse waveforms
        shell: pwsh
        run: |
          & "build/material-editor/Release/editor-animation-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "Animation regression tests failed" }

      - name: Verify portable EXE and dynamic library imports
        shell: pwsh
        run: |
          $exe = "build/material-editor/Release/jkgm-material-editor.exe"
          if (!(Test-Path $exe)) { throw "Editor executable not found" }
          $imports = & dumpbin /DEPENDENTS $exe | Out-String
          Write-Host $imports
          if ($imports -match '(?i)(qt6|glfw3\.dll|vcruntime140|msvcp140)') {
            throw "Unexpected third-party runtime DLL dependency in editor"
          }
          New-Item -ItemType Directory -Force artifacts/editor | Out-Null
          Copy-Item $exe artifacts/editor/

      - name: Upload single-file editor
        uses: actions/upload-artifact@v4
        with:
          name: JkGfxMod-Material-Editor-Windows-x64
          path: artifacts/editor/jkgm-material-editor.exe
          if-no-files-found: error
