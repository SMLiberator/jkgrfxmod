name: CI

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Enable Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build
      run: MSBuild.exe -t:Build -p:Configuration=Release -p:Platform=x86 -p:PlatformToolset=v143 jkgfxmod.sln

    - name: Material transition regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\runtime_material_state.cpp /Fe:runtime_material_state_test.exe
        runtime_material_state_test.exe
    - name: Vertex color lookup regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\fast_vertex_colors.cpp /Fe:fast_vertex_colors_test.exe
        fast_vertex_colors_test.exe
    - name: Active render camera inversion regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\active_rd_camera.cpp /Fe:active_rd_camera_test.exe
        active_rd_camera_test.exe
    - name: Native MAT mip level override tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\native_mat_mips.cpp /Fe:native_mat_mips_test.exe
        native_mat_mips_test.exe
    - name: GPU 3DO native model-view precision tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\gpu_3do_modelview.cpp /Fe:gpu_3do_modelview_test.exe
        gpu_3do_modelview_test.exe
    - name: Verified native JKGM ThingNode accessor validation tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\thing_node_native.cpp /Fe:thing_node_native_test.exe
        thing_node_native_test.exe
    - name: Animated ThingNode pose and attachment reference tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\thing_node_math.cpp /Fe:thing_node_math_test.exe
        thing_node_math_test.exe
    - name: JK/MotS collision dispatcher regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\mots_collision_dispatch.cpp /Fe:mots_collision_dispatch_test.exe
        mots_collision_dispatch_test.exe
    - name: Read-only JKGM 3DO collision mesh snapshots
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\mots_native_mesh_snapshot.cpp /Fe:mots_native_mesh_snapshot_test.exe
        mots_native_mesh_snapshot_test.exe
    - name: Geometry-centered mesh collision and automatic tree bounds
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\mots_mesh_collision_bounds.cpp /Fe:mots_mesh_collision_bounds_test.exe
        mots_mesh_collision_bounds_test.exe
    - name: MotS animated collision sphere-tree reference tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\mots_sphere_tree.cpp /Fe:mots_sphere_tree_test.exe
        mots_sphere_tree_test.exe
    - name: SPR extended orientation modes
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_orientation.cpp /Fe:sprite_orientation_test.exe
        sprite_orientation_test.exe
    - name: SPR per-instance cache alpha tag regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_alpha_tag.cpp /Fe:sprite_alpha_tag_test.exe
        sprite_alpha_tag_test.exe
    - name: SPR decal GPU mesh and MAT UV preparation tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_decal_gpu_mesh.cpp /Fe:sprite_decal_gpu_mesh_test.exe
        sprite_decal_gpu_mesh_test.exe
    - name: SPR projected decal transform and roll tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_decal_projector.cpp /Fe:sprite_decal_projector_test.exe
        sprite_decal_projector_test.exe
    - name: Native JK23 projected decal surface extraction tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_decal_world.cpp /Fe:sprite_decal_world_test.exe
        sprite_decal_world_test.exe
    - name: Projected SPR decal geometry clipping tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_decal_clip.cpp /Fe:sprite_decal_clip_test.exe
        sprite_decal_clip_test.exe
    - name: Sprite flare center-depth and opacity tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_flare_visibility.cpp /Fe:sprite_flare_visibility_test.exe
        sprite_flare_visibility_test.exe
    - name: Sprite roll geometry and timing tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_roll.cpp /Fe:sprite_roll_test.exe
        sprite_roll_test.exe
    - name: Per-Thing sprite interpolation and lifecycle tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_instance_info.cpp /Fe:sprite_instance_info_test.exe
        sprite_instance_info_test.exe
    - name: Captured SPR type and resource lifecycle tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_type_registry.cpp /Fe:sprite_type_registry_test.exe
        sprite_type_registry_test.exe
    - name: Sprite type patcher PE regression tests
      run: python tests/test_sprite_type_patcher.py
    - name: Projected decal basis and configuration tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\projected_decal.cpp /Fe:projected_decal_test.exe
        projected_decal_test.exe
    - name: Mutable cached 3DO source signature regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\gpu_3do_cache_signature.cpp /Fe:gpu_3do_cache_signature_test.exe
        gpu_3do_cache_signature_test.exe
    - name: GPU 3DO cached polygon triangulation regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\gpu_3do_triangulation.cpp /Fe:gpu_3do_triangulation_test.exe
        gpu_3do_triangulation_test.exe
    - name: GPU 3DO GeoMode and mirror compatibility tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\gpu_3do_compat.cpp /Fe:gpu_3do_compat_test.exe
        gpu_3do_compat_test.exe
    - name: GPU 3DO native sphere visibility regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\gpu_3do_frustum.cpp /Fe:gpu_3do_frustum_test.exe
        gpu_3do_frustum_test.exe
    - name: GPU 3DO uploaded texture alpha regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\texture_alpha.cpp /Fe:texture_alpha_test.exe
        texture_alpha_test.exe
    - name: Retro CMP palette quantization regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /O2 /I. tests\retro_palette.cpp /Fe:retro_palette_test.exe
        retro_palette_test.exe
    - name: Retro CMP log/file comparison self-test
      run: python tools/verify_retro_cmp.py --self-test
    - name: GPU 3DO colormap tint regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\gpu_3do_colormap.cpp /Fe:gpu_3do_colormap_test.exe
        gpu_3do_colormap_test.exe
    - name: GPU 3DO alpha partition tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\gpu_3do_alpha.cpp /Fe:gpu_3do_alpha_test.exe
        gpu_3do_alpha_test.exe
    - name: Native palette effect accumulation regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\jk_palette_effects.cpp /Fe:jk_palette_effects_test.exe
        jk_palette_effects_test.exe
    - name: Native 3DO profiler counter regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\native_3do_profile.cpp /Fe:native_3do_profile_test.exe
        native_3do_profile_test.exe
    - name: Native JKGM EXE bootstrap PE regression tests
      run: python tests/test_bootstrap_patcher.py
    - name: Frame profiler counter regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\frame_profile_gaps.cpp /Fe:frame_profile_gaps_test.exe
        frame_profile_gaps_test.exe
    - name: Package standalone development binaries
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path test-build -Force | Out-Null
        foreach ($fileName in @('renderer.dll', 'compile.exe')) {
          $candidate = Get-ChildItem -Path . -Recurse -File -Filter $fileName |
            Where-Object { $_.FullName -match '[\\/](Release|release)[\\/]' } |
            Select-Object -First 1
          if ($candidate) {
            Copy-Item $candidate.FullName (Join-Path 'test-build' $fileName) -Force
          }
        }
        if (-not (Test-Path 'test-build/renderer.dll')) {
          throw "Could not find the built renderer.dll"
        }
        if (-not (Test-Path 'test-build/compile.exe')) {
          throw "Could not find the rebuilt material pack compiler"
        }
        Copy-Item 'tools/patch_jkgm_bootstrap.py' 'test-build/patch_jkgm_bootstrap.py' -Force
        Copy-Item 'tools/patch_jkgm_sprite_types.py' 'test-build/patch_jkgm_sprite_types.py' -Force
        Copy-Item 'tools/verify_retro_cmp.py' 'test-build/verify_retro_cmp.py' -Force
        Copy-Item 'assets/jkgm.json' 'test-build/jkgm.json' -Force
        Copy-Item 'doc/install.md' 'test-build/install.md' -Force
        # Runtime GLSL is loaded from data_path/shaders. The test must ship
        # changed shaders alongside the DLL or the new fast path will not run.
        New-Item -ItemType Directory -Path 'test-build/jkgm/shaders' -Force | Out-Null
        Copy-Item 'assets/shaders/game_opaque_pass.frag' 'test-build/jkgm/shaders/' -Force
        Copy-Item 'assets/shaders/game_trns_pass.frag' 'test-build/jkgm/shaders/' -Force
        Copy-Item 'assets/shaders/post_opaque_composite.frag' 'test-build/jkgm/shaders/' -Force
        Copy-Item 'assets/shaders/post_to_srgb.frag' 'test-build/jkgm/shaders/' -Force
        Copy-Item 'assets/shaders/post_frame_blend.frag' 'test-build/jkgm/shaders/' -Force
        Copy-Item 'assets/shaders/gpu_3do_preview.vert' 'test-build/jkgm/shaders/' -Force
        Copy-Item 'assets/shaders/gpu_3do_preview.frag' 'test-build/jkgm/shaders/' -Force
    - name: Upload standalone development test build
      uses: actions/upload-artifact@v4
      with:
        name: jkgrfxmod-standalone-development
        path: test-build/*
        if-no-files-found: error
