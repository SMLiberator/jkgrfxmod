name: CI

on:
  push:
    branches: [master, development]
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Enable Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build
      run: MSBuild.exe -t:Build -p:Configuration=Release -p:Platform=x86 -p:PlatformToolset=v143 jkgfxmod.sln

    - name: OpenGL texture unit registry and sampler collision guards
      run: python3 tests/texture_unit_registry.py

    - name: Repository structure, sample config, and project headers
      run: python3 tests/repository_structure.py

    - name: Standalone native utility and mesh cache unit tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\cog_pyr_math.cpp /Fe:cog_pyr_math_test.exe
        cog_pyr_math_test.exe
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\gpu_3do_cache_signature.cpp /Fe:gpu_3do_cache_signature_test.exe
        gpu_3do_cache_signature_test.exe
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\gpu_mesh_cache_eviction.cpp /Fe:gpu_mesh_cache_eviction_test.exe
        gpu_mesh_cache_eviction_test.exe
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\native_mesh_revision_policy.cpp /Fe:native_mesh_revision_policy_test.exe
        native_mesh_revision_policy_test.exe
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_orientation.cpp /Fe:sprite_orientation_test.exe
        sprite_orientation_test.exe
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_gpu_depth_offset.cpp /Fe:sprite_gpu_depth_offset_test.exe || exit /b 1
        sprite_gpu_depth_offset_test.exe || exit /b 1
        cl.exe /nologo /EHsc /std:c++17 /I. tests\sprite_procedural_quad.cpp /Fe:sprite_procedural_quad_test.exe || exit /b 1
        sprite_procedural_quad_test.exe || exit /b 1
        cl.exe /nologo /EHsc /std:c++17 /I. tests\gpu_3do_index_packing.cpp /Fe:gpu_3do_index_packing_test.exe || exit /b 1
        gpu_3do_index_packing_test.exe || exit /b 1

    - name: CameraToMat live material API regressions
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\camera_to_mat.cpp /Fe:camera_to_mat_test.exe || exit /b 1
        camera_to_mat_test.exe || exit /b 1

