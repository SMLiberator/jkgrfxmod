name: CI

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Enable Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build
      run: MSBuild.exe -t:Build -p:Configuration=Release -p:Platform=x86 -p:PlatformToolset=v143 jkgfxmod.sln

    - name: Compressed MP3 OGG FLAC decoder regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. /c tests\compressed_sound_codec.cpp /Fo:compressed_sound_test_driver.obj
        cl.exe /nologo /EHsc /std:c++17 /I. /c renderer\compressed_sound_codec.cpp /Fo:compressed_sound_test_impl.obj
        link.exe /nologo compressed_sound_test_driver.obj compressed_sound_test_impl.obj /OUT:compressed_sound_codec_test.exe
        compressed_sound_codec_test.exe

    - name: Compressed sound GOB forward-only read regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\compressed_sound_read.cpp /Fe:compressed_sound_read_test.exe
        compressed_sound_read_test.exe

    - name: Deferred GPU MAT warm-up queue lifetime and retry tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\native_mat_warm_queue.cpp /Fe:native_mat_warm_queue_test.exe
        native_mat_warm_queue_test.exe
    - name: GPU five-face lightsaber polyline geometry and view tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\gpu_polyline.cpp /Fe:gpu_polyline_test.exe
        gpu_polyline_test.exe

    - name: Native JK screenshot signature, PNG filename and row-flip tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\native_screenshot.cpp /Fe:native_screenshot_test.exe
        native_screenshot_test.exe

    - name: Native Thing LightRGB normalization, template copy and animated fade tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\thing_light_rgb.cpp /Fe:thing_light_rgb_test.exe
        thing_light_rgb_test.exe
        python3 tests/thing_light_rgb.py

    - name: Static.jkl saved Thing index native restore and bounds regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\saved_static_template.cpp /Fe:saved_static_template_test.exe
        saved_static_template_test.exe
        python3 tests/saved_static_template.py

    - name: Weak sunlight shadow intensity regression tests
      run: python3 tests/sun_shadow_intensity.py

    - name: Per-Thing saber SideMat RGB matching and frame isolation tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\saber_light_rgb.cpp /Fe:saber_light_rgb_test.exe
        saber_light_rgb_test.exe

    - name: Camera Thing HUD type regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\camera_hud_thing.cpp /Fe:camera_hud_thing_test.exe
        camera_hud_thing_test.exe
        python3 tests/camera_hud_alpha.py

    - name: COG RayCastEx native collideSize sphere regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\cog_raycast_native_sphere.cpp /Fe:cog_raycast_native_sphere_test.exe
        cog_raycast_native_sphere_test.exe

    - name: Explicit COG RayCastEx precision geometry regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\cog_raycast_ex.cpp /Fe:cog_raycast_ex_test.exe
        cog_raycast_ex_test.exe

    - name: COG Thing offset and position transforms regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\cog_thing_offsets.cpp /Fe:cog_thing_offsets_test.exe
        cog_thing_offsets_test.exe
    - name: Bounded transparency sorter regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\triangle_sort_budget.cpp /Fe:triangle_sort_budget_test.exe
        triangle_sort_budget_test.exe

    - name: Material transition regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\runtime_material_state.cpp /Fe:runtime_material_state_test.exe
        runtime_material_state_test.exe
    - name: GPU 3DO native model-view precision tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\gpu_3do_modelview.cpp /Fe:gpu_3do_modelview_test.exe
        gpu_3do_modelview_test.exe
    - name: COG MAT spotlight registry and animated-node tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\spotlight.cpp /Fe:spotlight_test.exe
        spotlight_test.exe
    - name: Spotlight shadow depth and static caster BVH tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\spotlight_shadow.cpp /Fe:spotlight_shadow_test.exe
        spotlight_shadow_test.exe
    - name: JKGM sector CMP and fullbright palette lookup tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\jk_cmp_gpu.cpp /Fe:jk_cmp_gpu_test.exe
        jk_cmp_gpu_test.exe
    - name: GPU sector crossing volume and candidate selection tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\sector_crossing.cpp /Fe:sector_crossing_test.exe
        sector_crossing_test.exe
    - name: GPU sector-crossing native 3DO staging tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\sector_crossing_gpu.cpp /Fe:sector_crossing_gpu_test.exe
        sector_crossing_gpu_test.exe
    - name: Source-indexed MAT fullbright mask regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\jk_cmp_fullbright_mask.cpp /Fe:jk_cmp_fullbright_mask_test.exe
        jk_cmp_fullbright_mask_test.exe
    - name: Animated moving decal GeoSet LOD enumeration regression
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\sprite_decal_geoset.cpp /Fe:sprite_decal_geoset_test.exe
        sprite_decal_geoset_test.exe
    - name: Native world GPU cache geometry and live surface state tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\world_cache.cpp /Fe:world_cache_test.exe
        world_cache_test.exe
    - name: Directional sunlight and empty-world shadow regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\sun_shadow.cpp /Fe:sun_shadow_test.exe
        sun_shadow_test.exe
    - name: Precise collide-3 native geometry and offset-node regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\precise_type3_native.cpp /Fe:precise_type3_native_test.exe
        precise_type3_native_test.exe

    - name: SPR decal GPU mesh and MAT UV preparation tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_decal_gpu_mesh.cpp /Fe:sprite_decal_gpu_mesh_test.exe
        sprite_decal_gpu_mesh_test.exe
    - name: SPR decal world BVH spatial query tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_decal_bvh.cpp /Fe:sprite_decal_bvh_test.exe
        sprite_decal_bvh_test.exe
    - name: Projected SPR decal geometry clipping tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\sprite_decal_clip.cpp /Fe:sprite_decal_clip_test.exe
        sprite_decal_clip_test.exe
    - name: Shared native MAT readiness cache regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\gpu_mat_ready_cache.cpp /Fe:gpu_mat_ready_cache_test.exe
        gpu_mat_ready_cache_test.exe
    - name: GPU 3DO cached polygon triangulation regression tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\\gpu_3do_triangulation.cpp /Fe:gpu_3do_triangulation_test.exe
        gpu_3do_triangulation_test.exe
    - name: GPU 3DO alpha partition tests
      shell: cmd
      run: |
        cl.exe /nologo /EHsc /std:c++17 /I. tests\gpu_3do_alpha.cpp /Fe:gpu_3do_alpha_test.exe
        gpu_3do_alpha_test.exe
    - name: Native JKGM EXE bootstrap PE regression tests
      run: python tests/test_bootstrap_patcher.py
    - name: Package standalone development binaries
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path test-build -Force | Out-Null
        # Runtime-only artifact. The material compiler, audio probe,
        # legacy sprite patcher and diagnostic scripts belong in source/tools,
        # not in each downloadable game test build.
        $renderer = Get-ChildItem -Path . -Recurse -File -Filter 'renderer.dll' |
          Where-Object { $_.FullName -match '[\\/](Release|release)[\\/]' } |
          Select-Object -First 1
        if (-not $renderer) { throw "Could not find the built renderer.dll" }
        Copy-Item $renderer.FullName 'test-build/renderer.dll' -Force
        Copy-Item 'tools/patch_jkgm_bootstrap.py' 'test-build/patch_jkgm_bootstrap.py' -Force
        Copy-Item 'assets/jkgm.json' 'test-build/jkgm.json' -Force
        Copy-Item 'doc/install.md' 'test-build/install.md' -Force
        # Runtime GLSL is read from data_path/shaders at startup. Ship the
        # complete current shader set, including shader files added after
        # the original hand-maintained packaging list.
        New-Item -ItemType Directory -Path 'test-build/jkgm/shaders' -Force | Out-Null
        Copy-Item -Path 'assets/shaders/*' -Destination 'test-build/jkgm/shaders/' -Recurse -Force
    - name: Verify standalone GLSL packaging
      shell: pwsh
      run: |
        $sourceShaders = @(Get-ChildItem -Path 'assets/shaders' -File)
        if ($sourceShaders.Count -eq 0) { throw "No source shaders were found" }
        foreach ($shader in $sourceShaders) {
          $packaged = Join-Path 'test-build/jkgm/shaders' $shader.Name
          if (-not (Test-Path -LiteralPath $packaged -PathType Leaf)) {
            throw "Missing packaged shader: $($shader.Name)"
          }
          $originalHash = (Get-FileHash -LiteralPath $shader.FullName -Algorithm SHA256).Hash
          $packagedHash = (Get-FileHash -LiteralPath $packaged -Algorithm SHA256).Hash
          if ($originalHash -ne $packagedHash) {
            throw "Packaged shader differs from source: $($shader.Name)"
          }
        }
        foreach ($name in @('spotlight_shadow.vert', 'spotlight_shadow.frag')) {
          if (-not (Test-Path -LiteralPath (Join-Path 'test-build/jkgm/shaders' $name))) {
            throw "Required spotlight shadow shader missing: $name"
          }
        }
        Write-Host "Verified $($sourceShaders.Count) packaged shaders against repository sources."
    - name: Upload standalone development test build
      uses: actions/upload-artifact@v4
      with:
        name: jkgrfxmod-standalone-development
        path: test-build/*
        if-no-files-found: error
        retention-days: 7

  prune-old-runs:
    name: Prune obsolete development CI runs
    # Scheduled workflows only run from master (the repo default branch).
    # Instead, prune after EVERY development CI push, even failed builds,
    # without introducing a new workflow on master.
    needs: [build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
    - name: Checkout development branch
      uses: actions/checkout@v4
    - name: Run safe CI history prune
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 -m unittest discover -s tests -p test_prune_development_ci.py
        python3 tools/prune_development_ci.py --repo "${{ github.repository }}" --branch development --expected-head-sha "${{ github.sha }}" --keep-latest 40 --keep-failures 5 --max-deletes 100 --execute
